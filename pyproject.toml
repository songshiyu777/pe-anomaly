[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-anomaly"
version = "0.1.0"
description = "纯 Python 零依赖 PE 文件结构异常扫描器 | Pure-Python PE structural anomaly scanner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Song Shiyu (宋诗雨)"},
]
keywords = ["pe", "portable-executable", "packer-detection", "malware-analysis", "security", "reverse-engineering", "PE结构分析", "加壳检测", "安全审计", "逆向工程", "二进制分析"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Operating System",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
pe-anomaly = "pe_anomaly.cli:main"

[project.urls]
Homepage = "https://github.com/songshiyu777/pe-anomaly"
Repository = "https://github.com/songshiyu777/pe-anomaly"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
